# =============================================================================
# CI Pipeline — Lint, Security Scan, Build Test
# =============================================================================
# Runs on: push to main, all pull requests
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Lint: Dockerfile, Compose, Markdown
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

  # ---------------------------------------------------------------------------
  # Security: Vulnerability scan, secret detection
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "secret_key.*changeme" core-config/settings.yml | grep -v "^#"; then
            echo "::warning::Default secret_key in settings.yml (expected for template)"
          fi
          if grep -rn "SEARXNG_SECRET=.*" .env.example | grep -v "^#" | grep -v "SEARXNG_SECRET=$"; then
            echo "::error::Hardcoded secret in .env.example"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build Test: Build image, start stack, run health checks
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: searxng-docker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^SEARXNG_SECRET=.*/SEARXNG_SECRET=$(openssl rand -hex 32)/" .env
          echo "SEARXNG_IMAGE=searxng-docker:test" >> .env

      - name: Start stack
        run: |
          docker compose up -d
          sleep 20

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8080/healthz; then
              echo "✓ SearXNG healthy"
              exit 0
            fi
            echo "Waiting for SearXNG... ($i/15)"
            sleep 5
          done
          echo "✗ SearXNG failed to become healthy"
          docker compose logs
          exit 1

      - name: Test search API
        run: |
          response=$(curl -sf "http://localhost:8080/search?q=test&format=json")
          echo "$response" | python3 -c "
import sys, json
data = json.load(sys.stdin)
results = data.get('results', [])
print(f'Search returned {len(results)} results')
if len(results) == 0:
    print('::warning::No results returned (may be rate-limited)')
"

      - name: Test cppreference engine
        run: |
          response=$(curl -sf "http://localhost:8080/search?q=std::vector&engines=cppreference&format=json")
          echo "$response" | python3 -c "
import sys, json
data = json.load(sys.stdin)
results = data.get('results', [])
print(f'cppreference returned {len(results)} results')
"

      - name: Cleanup
        if: always()
        run: docker compose down -v

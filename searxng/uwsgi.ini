[uwsgi]
# Количество воркеров
workers = 4

# Тип сервера
http-socket = 0.0.0.0:8080

# Логирование каждого запроса (видно в docker compose logs)
# Раскомментируйте для детального лога:
# log-format = [%(addr)] %(method) %(uri) => %(status) (%(msecs)ms)

# Размер буфера
buffer-size = 8192

# Кэш статических файлов
cache2 = name=searxng_cache,items=2000,blocks=2000,blocksize=4096,bitmap=1

# Отключаем мастер-процесс логи (чище вывод)
disable-logging = false
log-5xx = true

# Статические файлы
static-map = /static=/usr/local/searxng/searxng/static
static-safe = /usr/local/searxng/searxng/static

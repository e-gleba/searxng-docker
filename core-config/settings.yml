# ============================================
# Конфигурация SearXNG — безопасные дефолты (2026)
# Документация: https://docs.searxng.org/admin/settings/
#
# Это ЕДИНСТВЕННОЕ место для настроек SearXNG.
# Порт и URL задаются ТОЛЬКО здесь.
# ============================================

general:
  debug: false
  instance_name: "SearXNG"
  privacypolicy_url: false
  donation_url: false
  contact_url: ""
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "http://localhost:8080/"
  limiter: false
  public_instance: false
  secret_key: "changeme"  # ОБЯЗАТЕЛЬНО смените: openssl rand -hex 32
  image_proxy: true
  method: "POST"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: "ru"
  theme_args:
    simple_style: auto
  results_on_new_tab: false
  infinite_scroll: true
  query_in_title: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    timeout: 6.0

  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    timeout: 6.0

  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false
    timeout: 6.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    timeout: 3.0

  - name: google
    engine: google
    shortcut: g
    disabled: false
    timeout: 6.0

  - name: duckduckgo images
    engine: duckduckgo_extra
    categories: images
    shortcut: ddgi
    disabled: false
    timeout: 6.0

  - name: unsplash
    engine: unsplash
    shortcut: us
    disabled: false
    timeout: 6.0

  - name: duckduckgo videos
    engine: duckduckgo_extra
    categories: videos
    shortcut: ddgv
    disabled: false
    timeout: 6.0

  - name: peerpipe
    engine: peerpipe
    shortcut: pp
    disabled: false
    timeout: 10.0

  - name: stackoverflow
    engine: stackoverflow
    shortcut: st
    disabled: false
    timeout: 6.0

  - name: github
    engine: github
    shortcut: gh
    disabled: false
    timeout: 6.0

  - name: arch linux wiki
    engine: archlinux
    shortcut: al
    disabled: false
    timeout: 6.0

  - name: arxiv
    engine: arxiv
    shortcut: ar
    disabled: false
    timeout: 10.0

  - name: crossref
    engine: crossref
    shortcut: cr
    disabled: false
    timeout: 10.0

  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    disabled: false
    timeout: 6.0

  - name: bing
    engine: bing
    disabled: true

  - name: yahoo
    engine: yahoo
    disabled: true

  - name: qwant
    engine: qwant
    disabled: true

plugins:
  - name: "Basic Calculator"
    disabled: false
  - name: "Hash plugin"
    disabled: false
  - name: "Hostnames plugin"
    disabled: false
  - name: "Infinite scroll"
    disabled: false
  - name: "Tracker URL remover"
    disabled: false
  - name: "Open Access DOI rewrite"
    disabled: false
  - name: "Unit converter plugin"
    disabled: false

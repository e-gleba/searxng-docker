# ============================================
# SearXNG settings.yml — оптимизировано для домашнего использования
# Vim hotkeys, dark theme, максимальная скорость
# ============================================

use_default_settings: true

general:
  instance_name: "SearXNG"
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "changeme"
  base_url: "http://localhost:8080/"
  image_proxy: true
  limiter: false
  public_instance: false
  method: "POST"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json
  
  # Защита от банов — увеличенное время приостановки после ошибок
  suspended_times:
    SearxEngineAccessDenied: 3600      # 1 час после 403
    SearxEngineCaptcha: 7200            # 2 часа после капчи
    SearxEngineTooManyRequests: 1800    # 30 минут после 429
    cf_SearxEngineCaptcha: 86400        # 24 часа (Cloudflare)
    cf_SearxEngineAccessDenied: 86400   # 24 часа
    recaptcha_SearxEngineCaptcha: 86400 # 24 часа

ui:
  default_theme: simple
  default_locale: "ru"
  hotkeys: vim  # Vim-навигация: j/k — вверх/вниз, / — фокус на поиск, n/N — следующий/предыдущий
  theme_args:
    simple_style: dark  # Темная тема (auto, light, dark, black)
  infinite_scroll: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  
  # Опционально: API ключи для стабильной работы (раскомментируй и добавь свои)
  # Brave API: https://brave.com/search/api/ (бесплатно 2000 запросов/месяц)
  # Google Custom Search: https://console.cloud.google.com/ (бесплатно 100 запросов/день)
  
  # Опционально: прокси для анонимности (раскомментируй если нужно)
  # proxies:
  #   all://:
  #     - "http://proxy1:8080"
  #     - "socks5://proxy2:1080"
  
  # Или Tor (медленно, но анонимно):
  # proxies:
  #   all://:
  #     - "socks5h://127.0.0.1:9050"
  # using_tor_proxy: true
  # extra_proxy_timeout: 10

# Включаем движки, отключённые по умолчанию
engines:
  - name: yandex
    disabled: false

  - name: yandex images
    disabled: false

# Отключаем bloat (медленные/ненадёжные движки)
  - name: bing
    disabled: true

  - name: bing images
    disabled: true

  - name: bing news
    disabled: true

  - name: bing videos
    disabled: true

  - name: yahoo
    disabled: true

  - name: qwant
    disabled: true

  - name: mojeek
    disabled: true

  - name: hackernews
    disabled: true

# Custom dev-движки
  - name: cppreference
    engine: xpath
    shortcut: cpp
    categories: [it]
    search_url: https://en.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a
    content_xpath: //li[@class='mw-search-result']/div[@class='searchresult']
    about:
      website: https://en.cppreference.com/
      wikidata_id: Q17155929
      use_official_api: false
      require_api_key: false
      results: HTML

  - name: cppreference ru
    engine: xpath
    shortcut: cppru
    categories: [it]
    search_url: https://ru.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a
    content_xpath: //li[@class='mw-search-result']/div[@class='searchresult']
    about:
      website: https://ru.cppreference.com/
      use_official_api: false
      require_api_key: false
      results: HTML

  - name: devdocs
    engine: xpath
    shortcut: dd
    categories: [it]
    search_url: https://devdocs.io/search?q={query}
    url_xpath: //a[@class='_item']
    title_xpath: //a[@class='_item']
    content_xpath: //a[@class='_item']
    about:
      website: https://devdocs.io/
      use_official_api: false
      require_api_key: false
      results: HTML

# Плагины — официальный формат (dict с fully-qualified class names)
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true

  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true

  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

  searx.plugins.unit_converter.SXNGPlugin:
    active: true

  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

  searx.plugins.hostnames.SXNGPlugin:
    active: true

  searx.plugins.time_zone.SXNGPlugin:
    active: true

  searx.plugins.self_info.SXNGPlugin:
    active: true

  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true

  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false

  searx.plugins.tor_check.SXNGPlugin:
    active: false

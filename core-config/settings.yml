# =============================================================================
# SearXNG Configuration — Developer Search Profile
# =============================================================================
# Docs: https://docs.searxng.org/admin/settings/
# =============================================================================

use_default_settings: true

general:
  instance_name: "SearXNG Dev Search"
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET}"
  base_url: "${SEARXNG_BASE_URL}"
  image_proxy: true
  limiter: false
  public_instance: false
  method: "POST"

redis:
  url: "${SEARXNG_REDIS_URL}"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json

  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 7200
    SearxEngineTooManyRequests: 1800
    cf_SearxEngineCaptcha: 86400
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 86400

ui:
  default_theme: simple
  default_locale: "en"
  hotkeys: vim
  theme_args:
    simple_style: dark
  infinite_scroll: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: bing
    disabled: true
  - name: bing images
    disabled: true
  - name: bing news
    disabled: true
  - name: bing videos
    disabled: true
  - name: yahoo
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

  - name: yandex
    disabled: false
  - name: yandex images
    disabled: false
  - name: stackoverflow
    disabled: false
    shortcut: so
  - name: github
    disabled: false
    shortcut: gh
  - name: wikipedia
    disabled: false
    shortcut: wiki

  - name: cppreference
    engine: xpath
    shortcut: cpp
    categories: [it]
    search_url: https://en.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a
    content_xpath: //li[@class='mw-search-result']/div[@class='searchresult']
    about:
      website: https://en.cppreference.com/
      wikidata_id: Q17155929
      use_official_api: false
      require_api_key: false
      results: HTML

  - name: cppreference ru
    engine: xpath
    shortcut: cppru
    categories: [it]
    search_url: https://ru.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[@class='mw-search-result']/div[@class='mw-search-result-heading']/a
    content_xpath: //li[@class='mw-search-result']/div[@class='searchresult']
    about:
      website: https://ru.cppreference.com/
      use_official_api: false
      require_api_key: false
      results: HTML

  - name: devdocs
    engine: xpath
    shortcut: dd
    categories: [it]
    search_url: https://devdocs.io/search?q={query}
    url_xpath: //a[contains(@class, '_item')]/@href
    title_xpath: //a[contains(@class, '_item')]
    content_xpath: //a[contains(@class, '_item')]
    about:
      website: https://devdocs.io/
      use_official_api: false
      require_api_key: false
      results: HTML

  - name: godot docs
    engine: xpath
    shortcut: godot
    categories: [it]
    search_url: https://docs.godotengine.org/en/stable/search.html?q={query}&check_keywords=yes&area=default
    url_xpath: //div[contains(@class,'search-result')]//a/@href
    title_xpath: //div[contains(@class,'search-result')]//a
    content_xpath: //div[contains(@class,'search-result')]//p
    about:
      website: https://docs.godotengine.org/
      use_official_api: false
      require_api_key: false
      results: HTML

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false

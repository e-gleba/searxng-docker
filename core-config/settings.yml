# ============================================
# SearXNG settings.yml — оптимизировано для скорости и эффективности
# https://docs.searxng.org/admin/settings/settings.html#use-default-settings
# ============================================

use_default_settings: true

general:
  instance_name: "SearXNG"
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "changeme"
  base_url: "http://localhost:8080/"
  image_proxy: true
  limiter: false
  method: "POST"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json
  
  # Увеличенные времена приостановки после ошибок (защита от банов)
  suspended_times:
    SearxEngineAccessDenied: 3600      # 1 час после 403
    SearxEngineCaptcha: 7200            # 2 часа после капчи
    SearxEngineTooManyRequests: 1800    # 30 минут после 429
    cf_SearxEngineCaptcha: 86400        # 24 часа (Cloudflare капча)
    cf_SearxEngineAccessDenied: 86400   # 24 часа (Cloudflare бан)
    recaptcha_SearxEngineCaptcha: 86400 # 24 часа (reCAPTCHA)

ui:
  default_theme: simple
  default_locale: "ru"
  theme_args:
    simple_style: auto
  infinite_scroll: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
  enable_http2: true
  
  # User-Agent rotation (раскомментируй если нужно)
  # useragent_suffix: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  
  # Прокси для анонимности (раскомментируй и настрой)
  # proxies:
  #   all://:
  #     - "http://proxy1:8080"
  #     - "socks5://proxy2:1080"

engines:
  # === Включенные движки (были disabled по умолчанию) ===
  - name: yandex
    disabled: false

  - name: yandex images
    disabled: false

  # === Отключенные (bloat/медленные) ===
  - name: bing
    disabled: true

  - name: bing images
    disabled: true

  - name: bing news
    disabled: true

  - name: bing videos
    disabled: true

  - name: yahoo
    disabled: true

  - name: qwant
    disabled: true

  - name: mojeek
    disabled: true

  - name: hackernews
    disabled: true

  # === Оптимизированные таймауты ===
  - name: arxiv
    timeout: 5.0

  - name: pubmed
    timeout: 5.0

  - name: crossref
    timeout: 8.0

  # === API ключи (раскомментируй и добавь свои) ===
  
  # Brave Search API (бесплатно: 2000 запросов/месяц)
  # Получить: https://brave.com/search/api/
  # - name: brave
  #   disabled: false
  #   api_key: "YOUR_BRAVE_API_KEY"
  
  # Google Custom Search (бесплатно: 100 запросов/день)
  # Получить: https://console.cloud.google.com/
  # - name: google
  #   disabled: false
  #   google_api_key: "YOUR_API_KEY"
  #   google_cse_id: "YOUR_CSE_ID"

  # === Custom dev-движки ===
  
  # cppreference (C++ документация)
  - name: cppreference
    engine: xpath
    shortcut: cpp
    categories: it
    disabled: false
    timeout: 4.0
    paging: false
    search_url: https://en.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[contains(@class,'mw-search-result')]/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[contains(@class,'mw-search-result')]/div[@class='mw-search-result-heading']/a
    content_xpath: //li[contains(@class,'mw-search-result')]/div[@class='searchresult']
    about:
      website: https://en.cppreference.com
      wikidata_id: Q30093777
      use_official_api: false
      require_api_key: false
      results: HTML

  # cppreference на русском
  - name: cppreference ru
    engine: xpath
    shortcut: cppru
    categories: it
    disabled: false
    timeout: 4.0
    paging: false
    search_url: https://ru.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //li[contains(@class,'mw-search-result')]/div[@class='mw-search-result-heading']/a/@href
    title_xpath: //li[contains(@class,'mw-search-result')]/div[@class='mw-search-result-heading']/a
    content_xpath: //li[contains(@class,'mw-search-result')]/div[@class='searchresult']
    about:
      website: https://ru.cppreference.com
      wikidata_id: Q30093777
      use_official_api: false
      require_api_key: false
      results: HTML

  # DevDocs (унифицированная документация)
  - name: devdocs
    engine: xpath
    shortcut: dd
    categories: it
    disabled: false
    timeout: 3.0
    paging: false
    search_url: https://devdocs.io/search?q={query}
    url_xpath: //a[contains(@class,'_item')]/@href
    title_xpath: //a[contains(@class,'_item')]//span[@class='_name']
    content_xpath: //a[contains(@class,'_item')]//span[@class='_type']
    about:
      website: https://devdocs.io
      use_official_api: false
      require_api_key: false
      results: HTML

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true

  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true

  searx.plugins.open_access.SXNGPlugin:
    active: true

  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

  searx.plugins.unit_converter.SXNGPlugin:
    active: true

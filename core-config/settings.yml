# ============================================
# SearXNG settings.yml — минимальный, на базе официальных дефолтов
# https://docs.searxng.org/admin/settings/settings.html#use-default-settings
# ============================================

use_default_settings: true

general:
  instance_name: "SearXNG"
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "changeme"
  base_url: "http://localhost:8080/"
  image_proxy: true
  limiter: false
  method: "POST"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json

ui:
  default_theme: simple
  default_locale: "ru"
  theme_args:
    simple_style: auto
  infinite_scroll: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  enable_http2: true

# Включаем движки, отключённые по умолчанию в официальном конфиге.
# Все остальные (google, duckduckgo, brave, wikipedia, github,
# stackoverflow, arxiv, openstreetmap, youtube и т.д.)
# уже включены через use_default_settings: true
engines:
  - name: yandex
    disabled: false

  - name: yandex images
    disabled: false

  - name: bing
    disabled: false

  - name: mojeek
    disabled: false

  - name: mojeek images
    disabled: false

  - name: hackernews
    disabled: false

  - name: brave
    disabled: false

  - name: brave.images
    disabled: false

  - name: brave.videos
    disabled: false

  - name: brave.news
    disabled: false

# Плагины — официальный формат (dict с fully-qualified class names)
plugins:

  searx.plugins.calculator.SXNGPlugin:
    active: true

  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true

  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

  searx.plugins.unit_converter.SXNGPlugin:
    active: true

  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

  searx.plugins.hostnames.SXNGPlugin:
    active: true

  searx.plugins.time_zone.SXNGPlugin:
    active: true

  searx.plugins.self_info.SXNGPlugin:
    active: true

  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true

  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false

  searx.plugins.tor_check.SXNGPlugin:
    active: false

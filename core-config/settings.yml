# ============================================
# SearXNG settings.yml — оптимизирован для скорости и эффективности
# https://docs.searxng.org/admin/settings/settings.html#use-default-settings
# ============================================

use_default_settings: true

general:
  instance_name: "SearXNG"
  enable_metrics: false  # отключена телеметрия

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "changeme"  # ОБЯЗАТЕЛЬНО смените!
  base_url: "http://localhost:8080/"
  image_proxy: true  # проксирование картинок (privacy + performance)
  limiter: false  # отключено для приватного инстанса
  method: "POST"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json

ui:
  default_theme: simple
  default_locale: "ru"
  theme_args:
    simple_style: auto
  infinite_scroll: true

# Оптимизация таймаутов для скорости
outgoing:
  request_timeout: 4.0  # уменьшено с 6.0 для быстроты
  max_request_timeout: 10.0  # уменьшено с 15.0
  enable_http2: true
  pool_connections: 100
  pool_maxsize: 20

# Отключаем медленные/ненужные движки, включаем полезные
engines:
  # === ОТКЛЮЧАЕМ BLOAT ===
  - name: bing
    disabled: true

  - name: bing images
    disabled: true

  - name: bing news
    disabled: true

  - name: bing videos
    disabled: true

  - name: yahoo
    disabled: true

  - name: yahoo news
    disabled: true

  - name: qwant
    disabled: true

  - name: qwant news
    disabled: true

  - name: qwant images
    disabled: true

  - name: qwant videos
    disabled: true

  # Медленные/ненадёжные
  - name: mojeek
    disabled: true

  - name: mojeek images
    disabled: true

  - name: hackernews
    disabled: true  # часто таймаутит

  # === ВКЛЮЧАЕМ YANDEX (был отключён по умолчанию) ===
  - name: yandex
    disabled: false
    timeout: 5.0

  - name: yandex images
    disabled: false
    timeout: 5.0

  # === ОПТИМИЗИРУЕМ ТАЙМАУТЫ ДЛЯ МЕДЛЕННЫХ ДВИЖКОВ ===
  - name: arxiv
    timeout: 5.0  # уменьшено с 10.0

  - name: pubmed
    timeout: 5.0

  - name: crossref
    timeout: 8.0  # уменьшено с 30

  - name: openairepublications
    timeout: 5.0

  - name: openairedatasets
    timeout: 5.0

  # === CUSTOM DEV ENGINES ===
  # cppreference — C++ документация
  - name: cppreference
    engine: xpath
    shortcut: cpp
    categories: [it, science]
    paging: false
    search_url: https://en.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //ul[@class='mw-search-results']/li//a/@href
    title_xpath: //ul[@class='mw-search-results']/li//a
    content_xpath: //ul[@class='mw-search-results']/li/div[@class='searchresult']
    about:
      website: https://en.cppreference.com
      wikidata_id: Q1058560
      use_official_api: false
      require_api_key: false
      results: HTML

  # cppreference (русская версия)
  - name: cppreference ru
    engine: xpath
    shortcut: cppru
    categories: [it, science]
    paging: false
    search_url: https://ru.cppreference.com/mwiki/index.php?search={query}
    url_xpath: //ul[@class='mw-search-results']/li//a/@href
    title_xpath: //ul[@class='mw-search-results']/li//a
    content_xpath: //ul[@class='mw-search-results']/li/div[@class='searchresult']
    about:
      website: https://ru.cppreference.com
      use_official_api: false
      require_api_key: false
      results: HTML

  # DevDocs.io — унифицированная документация
  - name: devdocs
    engine: xpath
    shortcut: dd
    categories: [it]
    paging: false
    search_url: https://devdocs.io/#q={query}
    url_xpath: //div[@class='_list-item']/a/@href
    title_xpath: //div[@class='_list-item']/a
    content_xpath: //div[@class='_list-item']/div[@class='_snippet']
    timeout: 3.0
    about:
      website: https://devdocs.io
      use_official_api: false
      require_api_key: false
      results: HTML

# Плагины — только полезные
plugins:

  searx.plugins.calculator.SXNGPlugin:
    active: true

  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true

  searx.plugins.hash_plugin.SXNGPlugin:
    active: true

  searx.plugins.unit_converter.SXNGPlugin:
    active: true

  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

  searx.plugins.hostnames.SXNGPlugin:
    active: true

  searx.plugins.time_zone.SXNGPlugin:
    active: true

  searx.plugins.self_info.SXNGPlugin:
    active: true

  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true

  # Отключаем ненужные
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false

  searx.plugins.tor_check.SXNGPlugin:
    active: false

# =============================================================================
# SearXNG Docker — Private Single-User Stack
# =============================================================================

name: searxng

services:
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8-alpine}
    container_name: searxng-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - notice
      - --maxmemory
      - ${VALKEY_MAX_MEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  core:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: searxng-core
    restart: unless-stopped
    ports:
      # Loopback only. This is a private instance; nothing on the LAN or the
      # internet can reach it. Set SEARXNG_BIND_HOST=0.0.0.0 to widen it.
      - "${SEARXNG_BIND_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./core-config:/etc/searxng:ro
      - core-data:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://localhost:8080/}"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}"
      SEARXNG_REDIS_URL: "redis://valkey:6379/0"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  internal:
    driver: bridge

volumes:
  core-data:
    driver: local
  valkey-data:
    driver: local

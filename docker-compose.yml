# Основано на офіційному шаблоні SearXNG 2026
# Документація: https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./core-config/:/etc/searxng/
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

  # MCP сервер для LLM клієнтів (SSE транспорт на порту 32769)
  mcp:
    container_name: searxng-mcp
    image: ghcr.io/the-ai-workshops/searxng-mcp-server:latest
    restart: always
    ports:
      - "32769:32769"
    environment:
      - SEARXNG_BASE_URL=http://searxng-core:8080
      - HOST=0.0.0.0
      - PORT=32769
      - TRANSPORT=sse
    depends_on:
      - core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:
  valkey-data:

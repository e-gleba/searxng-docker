# =============================================================================
# SearXNG Production Stack
# =============================================================================
# Architecture: SearXNG Core + Valkey Cache
# Standards: Docker Compose v2, Health Checks, Structured Logging
# Auth: None (local-first, no-auth ready for development)
#
# ENDPOINTS AFTER DEPLOYMENT:
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Service      │ Container        │ Port  │ Status    │ URL              │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ SearXNG      │ searxng-core     │ 8080  │ ✓ Public  │ localhost:8080   │
# │ Valkey       │ searxng-valkey   │ 6379  │ ✗ Internal│ (not exposed)    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# SEARXNG ENDPOINTS:
#   • Web UI:        http://localhost:8080/
#   • Search API:    http://localhost:8080/search?q={query}&format=json
#   • Preferences:   http://localhost:8080/preferences
#   • Health Check:  http://localhost:8080/healthz
#
# HEALTH CHECK COMMANDS:
#   • docker compose ps
#   • curl -f http://localhost:8080/healthz
#   • docker exec searxng-valkey valkey-cli ping
#
# See ENDPOINTS.md for complete API documentation
# =============================================================================

name: searxng

services:
  # ---------------------------------------------------------------------------
  # Valkey - High-performance cache (Redis-compatible)
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --save 60 1
      --loglevel notice
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "searxng.valkey"
    networks:
      - searxng-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # SearXNG Core - Privacy-respecting metasearch engine
  # ---------------------------------------------------------------------------
  core:
    image: searxng/searxng:latest
    container_name: searxng-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./core-config:/etc/searxng:ro
      - core-data:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: changeme-use-openssl-rand-hex-32
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "searxng.core"
    networks:
      - searxng-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# =============================================================================
# Networks
# =============================================================================
networks:
  searxng-internal:
    driver: bridge
    name: searxng-internal
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  core-data:
    driver: local
    name: searxng-core-data
  valkey-data:
    driver: local
    name: searxng-valkey-data

services:
  searxng:
    image: searxng/searxng:${SEARXNG_IMAGE_TAG:-latest}
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng:/etc/searxng
      - ./data:/var/lib/searxng
    environment:
      - SEARXNG_BASE_URL=${BASE_URL:-http://localhost:8080/}
      - INSTANCE_NAME=${INSTANCE_NAME:-SearXNG}
      - AUTOCOMPLETE=${AUTOCOMPLETE:-google}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Production-grade SearXNG Docker Stack
# Based on official SearXNG 2026 architecture with Granian + Valkey + MCP

name: searxng

services:
  # SearXNG Core - Search Engine
  core:
    image: docker.io/searxng/searxng:latest
    container_name: searxng-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./core-config:/etc/searxng:ro
      - core-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Valkey - Redis-compatible cache
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # MCP Server - Model Context Protocol for LLM integration
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: searxng-mcp:latest
    container_name: searxng-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng-core:8080
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:
    driver: local
  valkey-data:
    driver: local

networks:
  default:
    name: searxng-network

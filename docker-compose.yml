# Основано на официальном шаблоне SearXNG 2026
# Документация: https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./core-config/:/etc/searxng/
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

  # MCP сервер для LLM клиентов (HTTP mode на порту 8000)
  mcp:
    container_name: searxng-mcp
    image: overtlids/mcp-searxng-enhanced:latest
    restart: always
    command: ["python", "mcp_server.py", "--http"]
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_ENGINE_API_BASE_URL=http://searxng-core:8080/search
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8000
      - DESIRED_TIMEZONE=Europe/Moscow
      - RETURNED_SCRAPPED_PAGES_NO=3
      - SCRAPPED_PAGES_NO=5
      - PAGE_CONTENT_WORDS_LIMIT=5000
      - CITATION_LINKS=True
      - MAX_IMAGE_RESULTS=10
      - MAX_VIDEO_RESULTS=10
      - MAX_FILE_RESULTS=5
      - MAX_MAP_RESULTS=5
      - MAX_SOCIAL_RESULTS=5
      - TRAFILATURA_TIMEOUT=15
      - SCRAPING_TIMEOUT=20
      - CACHE_MAXSIZE=100
      - CACHE_TTL_MINUTES=5
      - CACHE_MAX_AGE_MINUTES=30
      - RATE_LIMIT_REQUESTS_PER_MINUTE=10
      - RATE_LIMIT_TIMEOUT_SECONDS=60
      - IGNORED_WEBSITES=
    depends_on:
      - core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  core-data:
  valkey-data:
